[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "superdeterminism"
version = "0.1.0"
description = "Unagent: agnostic determinism advisor. Ingest traces, reconstruct the graph, recommend tool vs LLM flips."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Unagent contributors" }]
keywords = ["agents", "determinism", "otel", "langgraph"]
dependencies = []

[project.urls]
Homepage = "https://github.com/Vinayak-RZ/unagent"
Documentation = "https://github.com/Vinayak-RZ/unagent/blob/main/docs/README.md"
Repository = "https://github.com/Vinayak-RZ/unagent"
Issues = "https://github.com/Vinayak-RZ/unagent/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]
langgraph = [
    "langchain>=1.3,<2",
    "langgraph>=1.2,<2",
    "langchain-core>=1.4,<2",
]

[project.scripts]
superdeterminism = "superdeterminism.cli:main"
unagent-mcp = "superdeterminism.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
